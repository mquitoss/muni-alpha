[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "munialpha"
version = "0.1.0"
description = "Reproducible municipal data pipeline for Catalonia"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0,<2",
    "openpyxl>=3.1,<4",
    "osmium>=4.3,<5",
    "pyarrow>=25,<26",
    "pyogrio>=0.10,<1",
    "rasterio>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.3",
    "pytest>=8",
    "ruff>=0.6",
    "types-openpyxl>=3.1",
    "types-shapely>=2.1",
]

[project.scripts]
munialpha = "munialpha.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "munialpha.services"
ignore_errors = true
